{% extends 'slots/base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 animate__animated animate__fadeInUp">
                <!-- Header gradient -->
                <div class="card-header text-white text-center py-4 rounded-top-4" 
                     style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <h2 class="mb-0"><i class="fas fa-lock me-2"></i>Đăng nhập</h2>
                    <p class="mb-0 mt-2 small">Chào mừng bạn quay lại!</p>
                </div>

                <div class="card-body p-5">
                    <form method="post">
                        {% csrf_token %}

                        {% if form.non_field_errors %}
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                {{ form.non_field_errors }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endif %}

                        <!-- Trường Username -->
                        <div class="mb-4">
                            <label for="{{ form.username.id_for_label }}" class="form-label fw-bold">
                                <i class="fas fa-user me-2"></i>Tên đăng nhập
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user text-primary"></i></span>
                                <input type="text" name="{{ form.username.name }}" 
                                       id="{{ form.username.id_for_label }}"
                                       class="form-control form-control-lg {% if form.username.errors %}is-invalid{% endif %}"
                                       placeholder="Nhập tên đăng nhập"
                                       value="{{ form.username.value|default:'' }}">
                            </div>
                        </div>

                        <!-- Trường Password -->
                        <div class="mb-4">
                            <label for="{{ form.password.id_for_label }}" class="form-label fw-bold">
                                <i class="fas fa-key me-2"></i>Mật khẩu
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-primary"></i></span>
                                <input type="password" name="{{ form.password.name }}" 
                                       id="{{ form.password.id_for_label }}"
                                       class="form-control form-control-lg {% if form.password.errors %}is-invalid{% endif %}"
                                       placeholder="Nhập mật khẩu">
                            </div>
                        </div>

                        <!-- Tùy chọn ghi nhớ và quên mật khẩu -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                {{ form.remember_me }}
                                <label class="form-check-label" for="{{ form.remember_me.id_for_label }}">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                            <a href="{% url 'password_reset' %}" class="text-decoration-none small">Quên mật khẩu?</a>
                        </div>

                        <!-- Nút đăng nhập -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                                <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <!-- Link đăng ký -->
                    <div class="text-center">
                        <p class="mb-0">Chưa có tài khoản? 
                            <a href="{% url 'register' %}" class="text-primary fw-bold">Đăng ký ngay</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
