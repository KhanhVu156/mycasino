{% extends 'slots/base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <h2 class="text-center mb-4 fw-bold">{{ machine.name }}</h2>
    
    <div class="row align-items-center">
        <!-- CỘT TRÁI: BẢNG ĐIỀU KHIỂN -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h3 class="card-title text-success">Số dư: $<span id="balance">{{ balance }}</span></h3>
                    <h3 class="card-title text-warning">Jackpot: $<span id="jackpot">{{ jackpot }}</span></h3>
                    
                    <!-- Form gửi yêu cầu quay -->
                    <form id="spin-form" class="mt-4" data-machine-id="{{ machine.id }}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="bet" class="form-label fw-bold">Tiền cược:</label>
                            <input type="number" class="form-control form-control-lg" 
                                   id="bet" name="bet" 
                                   min="1" max="{{ balance }}" value="10" required>
                        </div>
                        <button type="submit" id="spin-btn" class="btn w-100 btn-lg">QUAY</button>
                    </form>
                    
                    <!-- Vùng hiển thị thông báo kết quả -->
                    <div id="result" class="alert mt-3 text-center fw-bold" style="display: none;"></div>
                </div>
            </div>
        </div>
        
        <!-- CỘT PHẢI: MÁY SLOT -->
        <div class="col-md-6 text-center">
            <div class="slot-machine">
                <div class="reels-container">
                    <div class="reel" id="reel1">?</div>
                    <div class="reel" id="reel2">?</div>
                    <div class="reel" id="reel3">?</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Gọi file JS tĩnh (Đảm bảo bạn đã di chuyển thư mục js ra ngoài css) -->
<script src="{% static 'slots/js/play.js' %}"></script>
{% endblock %}
